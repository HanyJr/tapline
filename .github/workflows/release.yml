name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/assets/**", "docs/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            check_target: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            check_target: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Compile check first, so errors can be saved where they are easy to read
      - name: Compile check
        id: check
        continue-on-error: true
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml ${{ matrix.check_target }} --color never 2>&1 | tee check.log; exit ${PIPESTATUS[0]}

      - name: Save build errors to a branch
        if: steps.check.outcome == 'failure'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cp check.log "$RUNNER_TEMP/logs/" && cd "$RUNNER_TEMP/logs"
          git init -q -b logs && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" logs:ci-logs-${{ runner.os }}
          exit 1

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Tapline v__VERSION__"
          releaseBody: |
            **Windows:** download `Tapline-Windows-Setup.exe`
            **Mac (Apple Silicon and Intel):** download `Tapline-Mac.dmg`

            New in this version: Watch mode, multi-step sequences, presets, mouse travel time, custom start/stop key, emergency stop, sound and notification, run history, tray / menu bar mode, open at login and update notices.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Same installers again under names that never change, so download links keep working
      - name: Upload installers with fixed names
        id: fixed
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          REPO: ${{ github.repository }}
        run: bash .github/upload-fixed.sh 2>&1 | tee upload.log; exit ${PIPESTATUS[0]}

      - name: Save upload log to a branch
        if: steps.fixed.outcome == 'failure'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/ulogs" && cp upload.log "$RUNNER_TEMP/ulogs/" && cd "$RUNNER_TEMP/ulogs"
          git init -q -b logs && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "upload log"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" logs:ci-logs-upload-${{ runner.os }}
          exit 1
