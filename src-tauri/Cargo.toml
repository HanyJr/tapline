[package]
name = "tapline"
version = "1.1.0"
description = "Tapline - repeat a click and Enter, as many times as you need"
authors = ["HanyJr"]
edition = "2021"

[lib]
name = "tapline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
