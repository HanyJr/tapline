[package]
name = "tapline"
version = "1.0.0"
description = "Tapline - repeat a click and Enter, as many times as you need"
authors = ["Ian Brown"]
edition = "2021"

[lib]
name = "tapline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
